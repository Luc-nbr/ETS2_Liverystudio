[package]
name = "ets2-core"
version = "0.1.0"
edition = "2021"
description = "Euro Truck Simulator 2 file formats (HashFS, SII, PMD/PMG, TOBJ/DDS) and paint job mod export"
license = "MIT"

[dependencies]
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
texpresso = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
cityhash-102-rs = "0.1"
tempfile = "3"
