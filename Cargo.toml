[workspace]
resolver = "2"
members = ["src-tauri", "crates/ets2-core"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Image encoding/decoding and BC compression are slow in debug builds.
[profile.dev.package."*"]
opt-level = 2

# The reference CityHash crate used in tests relies on wrapping arithmetic.
[profile.dev.package.cityhash-102-rs]
overflow-checks = false
